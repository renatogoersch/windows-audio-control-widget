ShortDescription: Windows Audio Control - Widget - a taskbar widget that sets the output, microphone and volume of each app.
Description: |-
  SlotMixer is a small widget for the Windows 11 taskbar. Each slot holds a running app (Chrome, Discord, a game) and, with
  one click, switches the audio output and microphone of that app only; the mouse wheel changes its volume. A fixed Windows
  slot controls the system default output, microphone and master volume. Global hotkeys, profiles, device-type icons and
  automatic updates are included.
