ShortDescription: Windows Audio Control - Widget - widget na barra de tarefas que troca saída, microfone e volume de cada app.
Description: |-
  O SlotMixer é um widget para a barra de tarefas do Windows 11. Cada slot guarda um app aberto (Chrome, Discord, um jogo)
  e, com um clique, troca a saída de áudio e o microfone só daquele app; a rolagem do mouse ajusta o volume dele. Um slot
  fixo do Windows controla a saída e o microfone padrão do sistema e o volume geral. Inclui atalhos globais, perfis, ícones
  por tipo de dispositivo e atualização automática.
