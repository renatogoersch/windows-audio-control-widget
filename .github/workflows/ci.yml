name: CI

# Builds on every push to main and on pull requests, and runs the tests once the test project exists.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build SlotMixer/SlotMixer.csproj -c Release

      - name: Test (skipped until tests/SlotMixer.Tests exists)
        shell: pwsh
        run: |
          $tests = 'tests/SlotMixer.Tests/SlotMixer.Tests.csproj'
          if (Test-Path $tests) {
            dotnet test $tests -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          else {
            'No test project yet: nothing to run.'
          }
